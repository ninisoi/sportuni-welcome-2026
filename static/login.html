<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPORTUNI WELCOME · შესვლა</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800;900&display=swap" rel="stylesheet"><style>body{min-height:100vh;display:grid;place-items:center;margin:0;background:radial-gradient(circle at 50% 10%,#215d81,#093759 70%,#041c32);font-family:'Noto Sans Georgian',sans-serif;color:white}.box{width:min(90vw,400px);border:1px solid #ffffff40;border-radius:26px;padding:32px;box-shadow:0 25px 60px #0005;background:#ffffff12}.brand{font-size:26px;font-weight:900}.brand span{color:#fdcb4e}h1{font-size:21px}input,button{box-sizing:border-box;width:100%;padding:15px;border:0;border-radius:12px;margin-top:13px;font:inherit}button{background:#fdcb4e;color:#093759;font-weight:900;cursor:pointer}p{color:#b7daef;font-size:13px}#error{color:#ffd0d0}</style></head><body><div class="box"><div class="brand">SPORT<span>UNI</span></div><p>WELCOME 2026 · დაცული შესვლა</p><h1>მართვის პანელი</h1><form id="login"><input required type="email" id="email" placeholder="ელფოსტა" autocomplete="username"><input required type="password" id="password" placeholder="პაროლი" autocomplete="current-password"><button>შესვლა</button><p id="error"></p></form></div><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('error');err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const j=await r.json();if(!r.ok)throw Error(j.detail||'შესვლა ვერ მოხერხდა');location.href=j.redirect}catch(ex){err.textContent=ex.message}}</script></body></html>
