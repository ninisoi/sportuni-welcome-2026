
<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPORTUNI WELCOME 2026 | Live Poll</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #05090e;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, "Noto Sans Georgian", sans-serif;
}

#pollScreen {
  position: relative;
  width: min(100vw, 133.333vh);
  aspect-ratio: 4 / 3;
  container-type: inline-size;
  background: #0b3654;
  overflow: hidden;
  isolation: isolate;
  border-radius: 18px;
  color: white;
}

#bubbleCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.topline {
  position: absolute;
  z-index: 2;
  top: 3%;
  left: 2%;
  right: 2%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  font-size: 2.15cqw;
  color: #ffda76;
  white-space: nowrap;
}

.live-label {
  font-size: 1.65cqw;
  padding: .7cqw 1.4cqw;
  border-radius: 30px;
  background: #315674;
  white-space: nowrap;
}

.question {
  position: absolute;
  z-index: 2;
  top: 10%;
  left: 7%;
  right: 7%;
  margin: 0;
  font-size: 3.6cqw;
  line-height: 1.35;
  font-weight: 750;
  text-align: center;
}

.results {
  position: absolute;
  z-index: 2;
  left: 3%;
  right: 3%;
  bottom: 8%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.2cqw;
  align-items: end;
  text-align: center;
}

.results.many {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  bottom: 6%;
}

.result {
  min-width: 0;
}

.percentage {
  display: table;
  margin: 0 auto;
  font-weight: 750;
  font-size: 4.25cqw;
  line-height: 1.25;
}

.heart {
  display: table;
  margin: 1.2cqw auto .7cqw;
  font-size: 2.25cqw;
}

.faculty {
  display: table;
  margin: auto;
  max-width: 100%;
  color: #d1dfe9;
  font-size: 1.9cqw;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.results.many .percentage {
  font-size: 2.8cqw;
}

.results.many .heart {
  font-size: 1.8cqw;
  margin: .5cqw auto;
}

.results.many .faculty {
  font-size: 1.15cqw;
}

.footer {
  position: absolute;
  z-index: 2;
  bottom: 1.4%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.5cqw;
  color: #cbd9e3;
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  /* The projector will use a static frame if
     the device requests reduced motion. */
}
</style>
</head>

<body>

<main id="pollScreen">

  <canvas id="bubbleCanvas"
          aria-hidden="true"></canvas>

  <header class="topline">
    <span class="brand protect">
      SPORTUNI WELCOME 2026
    </span>

    <span class="live-label protect">
      LIVE POLL
    </span>
  </header>

  <h1 id="pollQuestion"
      class="question protect">
    რომელი ფაკულტეტიდან ხარ?
  </h1>

  <section id="pollResults"
           class="results">
  </section>

  <footer class="footer protect">
    SPORTUNI • ჩემპიონები სწავლობენ აქ
  </footer>

</main>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const screen = $("pollScreen");
  const canvas = $("bubbleCanvas");
  const context = canvas.getContext("2d");
  const results = $("pollResults");
  const question = $("pollQuestion");

  if (!context) return;

  const TOTAL = 190;

  const defaults = [
    {text:"მწვრთნელთა ფაკულტეტი",
     color:"#FDCB4E",heart:"💛"},
    {text:"ფიზიკური მედიცინისა და რეაბილიტაციის ფაკულტეტი",
     color:"#49B99C",heart:"💚"},
    {text:"სპორტის მენეჯმენტისა და ადმინისტრირების ფაკულტეტი",
     color:"#65A8E7",heart:"🩵"}
  ];

  let options = defaults.map(x => ({
    ...x, percentage: 0
  }));

  let questionId = null;
  let hasVotes = false;
  let particles = [];
  let areas = [];
  let width = 1;
  let height = 1;
  let previousTime = 0;
  let lastColorAdjustment = 0;
  let loading = false;

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function getShares() {
    if (!options.length) return [];

    // Before the first vote, colors are evenly mixed.
    if (!hasVotes) {
      return options.map(() => 1 / options.length);
    }

    const values = options.map(o =>
      Math.max(0, Number(o.percentage) || 0)
    );

    const sum = values.reduce((a, b) => a + b, 0);

    return sum > 0
      ? values.map(v => v / sum)
      : options.map(() => 1 / options.length);
  }

  function pickOptionIndex() {
    const shares = getShares();
    let value = Math.random();

    for (let i = 0; i < shares.length; i++) {
      value -= shares[i];
      if (value <= 0) return i;
    }

    return Math.max(0, shares.length - 1);
  }

  function createParticle(index) {
    const angle = rand(0, Math.PI * 2);
    const velocity = rand(30, 62);

    return {
      x: rand(0, width),
      y: rand(0, height),
      vx: Math.cos(angle) * velocity,
      vy: Math.sin(angle) * velocity,
      radius: rand(width * .006, width * .016),
      optionIndex: index,
      opacity: rand(.5, .83)
    };
  }

  function resetParticles() {
    particles = Array.from(
      {length: TOTAL},
      () => createParticle(pickOptionIndex())
    );
  }

  function renderResults() {
    results.replaceChildren();
    results.classList.toggle(
      "many",
      options.length > 3
    );

    options.forEach(option => {
      const item = document.createElement("div");
      item.className = "result";

      const percentage = document.createElement("div");
      percentage.className = "percentage protect";
      percentage.style.color = option.color;
      percentage.textContent = hasVotes
        ? option.percentage + "%"
        : "—";

      const heart = document.createElement("div");
      heart.className = "heart protect";
      heart.textContent = option.heart;

      const label = document.createElement("div");
      label.className = "faculty protect";
      label.textContent = option.text;

      item.append(percentage, heart, label);
      results.appendChild(item);
    });

    updateProtectedAreas();
  }

  function updateProtectedAreas() {
    const base = screen.getBoundingClientRect();

    areas = [...screen.querySelectorAll(".protect")]
      .map(el => {
        const rect = el.getBoundingClientRect();

        return {
          left: rect.left - base.left - 6,
          right: rect.right - base.left + 6,
          top: rect.top - base.top - 6,
          bottom: rect.bottom - base.top + 6
        };
      });
  }

  function overlapsText(x, y, r) {
    return areas.some(a =>
      x + r > a.left &&
      x - r < a.right &&
      y + r > a.top &&
      y - r < a.bottom
    );
  }

  function resize() {
    const rect = screen.getBoundingClientRect();
    if (!rect.width || !rect.height) return;

    width = rect.width;
    height = rect.height;

    const ratio = Math.min(
      window.devicePixelRatio || 1, 2
    );

    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);

    context.setTransform(ratio, 0, 0, ratio, 0, 0);

    updateProtectedAreas();
    resetParticles();
  }

  // Gradually move the colors towards the
  // real vote percentages without sudden jumps.
  function adjustColors() {
    if (!options.length || !particles.length) return;

    const shares = getShares();

    const desired = shares.map(s =>
      Math.round(s * particles.length)
    );

    let difference = particles.length -
      desired.reduce((a, b) => a + b, 0);

    let cursor = 0;
    while (difference !== 0) {
      const i = cursor % desired.length;
      if (difference > 0) {
        desired[i]++;
        difference--;
      } else if (desired[i] > 0) {
        desired[i]--;
        difference++;
      }
      cursor++;
    }

    const actual = options.map((_, index) =>
      particles.filter(p =>
        p.optionIndex === index
      ).length
    );

    const under = actual.findIndex((n, i) =>
      n < desired[i]
    );

    if (under < 0) return;

    const over = actual.findIndex((n, i) =>
      n > desired[i]
    );

    if (over < 0) return;

    const candidates = particles.filter(p =>
      p.optionIndex === over
    );

    if (!candidates.length) return;

    const particle = candidates[
      Math.floor(Math.random() * candidates.length)
    ];

    particle.optionIndex = under;
  }

  function frame(now) {
    const dt = previousTime
      ? Math.min((now - previousTime) / 1000, .04)
      : 0;

    previousTime = now;
    context.clearRect(0, 0, width, height);

    if (now - lastColorAdjustment > 90) {
      adjustColors();
      lastColorAdjustment = now;
    }

    const reducedMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

    particles.forEach(p => {
      if (!reducedMotion) {
        const nx = p.x + p.vx * dt;
        const ny = p.y + p.vy * dt;

        if (overlapsText(nx, ny, p.radius)) {
          if (!overlapsText(nx, p.y, p.radius)) {
            p.vy *= -1;
            p.x = nx;
          } else if (!overlapsText(
            p.x, ny, p.radius
          )) {
            p.vx *= -1;
            p.y = ny;
          } else {
            p.vx *= -1;
            p.vy *= -1;
          }
        } else {
          p.x = nx;
          p.y = ny;
        }

        // Invisible re-entry from the opposite edge.
        if (p.x > width + p.radius) {
          p.x = -p.radius;
        } else if (p.x < -p.radius) {
          p.x = width + p.radius;
        }

        if (p.y > height + p.radius) {
          p.y = -p.radius;
        } else if (p.y < -p.radius) {
          p.y = height + p.radius;
        }
      }

      if (overlapsText(p.x, p.y, p.radius)) {
        return;
      }

      const color = options[p.optionIndex];
      if (!color) return;

      context.globalAlpha = p.opacity;
      context.fillStyle = color.color;
      context.beginPath();
      context.arc(
        p.x, p.y, p.radius,
        0, Math.PI * 2
      );
      context.fill();
    });

    context.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  async function loadResults() {
    if (loading) return;
    loading = true;

    try {
      const response = await fetch(
        "/api/screen/poll",
        {cache: "no-store"}
      );

      if (!response.ok) {
        throw new Error("Poll results unavailable");
      }

      const data = await response.json();

      if (!data.active || !data.question) {
        return;
      }

      const nextOptions = Array.isArray(data.options)
        ? data.options
        : [];

      if (!nextOptions.length) return;

      const changedQuestion =
        questionId !== data.question.id;

      questionId = data.question.id;
      question.textContent = data.question.text;
      hasVotes = Boolean(data.has_votes);

      options = nextOptions.map(option => ({
        text: option.text,
        color: option.color,
        heart: option.heart,
        percentage: option.percentage
      }));

      renderResults();

      if (changedQuestion) {
        resetParticles();
      }

    } catch (error) {
      console.warn("Live Poll update:", error);
    } finally {
      loading = false;
    }
  }

  renderResults();
  resize();
  requestAnimationFrame(frame);

  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(() => resize()).observe(screen);
  } else {
    window.addEventListener("resize", resize);
  }

  loadResults();
  setInterval(loadResults, 2000);
})();
</script>
</body>
</html>
