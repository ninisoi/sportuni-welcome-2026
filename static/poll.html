
<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b3654">
<title>SPORTUNI WELCOME 2026 | Live Poll</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #05090e;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, "Noto Sans Georgian", sans-serif;
}

#pollScreen {
  position: relative;
  width: min(100vw, 133.333vh);
  aspect-ratio: 4 / 3;
  container-type: inline-size;
  background: #0b3654;
  border-radius: 18px;
  overflow: hidden;
  isolation: isolate;
  color: #fff;
}

#bubbleCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.topline {
  position: absolute;
  z-index: 2;
  top: 3%;
  left: 2%;
  right: 2%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  color: #ffda76;
  font-size: 2.15cqw;
  white-space: nowrap;
}

.live-label {
  font-size: 1.65cqw;
  padding: .7cqw 1.4cqw;
  border-radius: 30px;
  background: #315674;
  white-space: nowrap;
}

.question {
  position: absolute;
  z-index: 2;
  top: 10%;
  left: 7%;
  right: 7%;
  margin: 0;
  font-size: 3.6cqw;
  line-height: 1.3;
  font-weight: 750;
  text-align: center;
  overflow-wrap: anywhere;
  text-wrap: balance;
}

/* ============================================
   RESULTS — BEAUTIFUL ALIGNED LAYOUT
   ============================================ */

.results {
  position: absolute;
  z-index: 2;
  left: 4%;
  right: 4%;
  bottom: 7%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.6cqw;
  align-items: start;
  text-align: center;
}

/* Every answer starts at the same height */
.result {
  min-width: 0;
  display: grid;
  grid-template-rows:
    4.6cqw
    3.5cqw
    minmax(0, auto);
  justify-items: center;
  align-items: start;
  align-content: start;
  padding: 0 .5cqw;
}

.percentage {
  display: block;
  margin: 0;
  font-weight: 800;
  font-size: 3.8cqw;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.035em;
}

.heart {
  display: block;
  margin: 0;
  font-size: 2.4cqw;
  line-height: 1.2;
}

.faculty {
  display: block;
  width: 100%;
  max-width: 29cqw;
  margin: 0 auto;
  color: #e4f0f8;
  font-size: 1.55cqw;
  line-height: 1.4;
  font-weight: 600;
  letter-spacing: -.012em;
  overflow-wrap: anywhere;
  text-align: center;
  text-wrap: balance;
}

/* Four or more answers */
.results.many {
  left: 3%;
  right: 3%;
  bottom: 6%;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1.2cqw;
  align-items: start;
}

.results.many .result {
  grid-template-rows:
    3.3cqw
    2.5cqw
    minmax(0, auto);
  padding: 0 .35cqw;
}

.results.many .percentage {
  font-size: 2.65cqw;
}

.results.many .heart {
  font-size: 1.8cqw;
  line-height: 1.1;
}

.results.many .faculty {
  max-width: 21cqw;
  font-size: 1.14cqw;
  line-height: 1.35;
}

/* Additional compact mode for 9–12 options */
.results.dense {
  bottom: 5%;
  gap: .65cqw 1cqw;
}

.results.dense .result {
  grid-template-rows:
    2.7cqw
    2cqw
    minmax(0, auto);
}

.results.dense .percentage {
  font-size: 2.2cqw;
}

.results.dense .heart {
  font-size: 1.45cqw;
}

.results.dense .faculty {
  font-size: .97cqw;
  line-height: 1.25;
}

/* ============================================
   FOOTER
   ============================================ */

.footer {
  position: absolute;
  z-index: 2;
  bottom: 1.4%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.5cqw;
  color: #cbd9e3;
  white-space: nowrap;
}

/* ============================================
   INITIAL LOADING
   ============================================ */

#loading {
  position: absolute;
  z-index: 4;
  inset: 0;
  display: grid;
  place-items: center;
  background: #0b3654;
  color: #d9e8f2;
  font-size: 2.1cqw;
  letter-spacing: .02em;
}

#loading[hidden] {
  display: none !important;
}

</style>
</head>

<body>

<main id="pollScreen">

  <canvas
    id="bubbleCanvas"
    aria-hidden="true">
  </canvas>

  <header class="topline">
    <span class="brand protect">
      SPORTUNI WELCOME 2026
    </span>

    <span class="live-label protect">
      LIVE POLL
    </span>
  </header>

  <h1
    class="question protect"
    id="pollQuestion">
  </h1>

  <section
    class="results"
    id="pollResults">
  </section>

  <footer class="footer protect">
    SPORTUNI • ჩემპიონები სწავლობენ აქ
  </footer>

  <div id="loading" aria-live="polite">
    შედეგები იტვირთება…
  </div>

</main>

<script>
(() => {
  "use strict";

  /* ============================================
     ELEMENTS
     ============================================ */

  const screen =
    document.getElementById("pollScreen");

  const canvas =
    document.getElementById("bubbleCanvas");

  const ctx =
    canvas.getContext("2d");

  const resultBox =
    document.getElementById("pollResults");

  const title =
    document.getElementById("pollQuestion");

  const loadingBox =
    document.getElementById("loading");

  if (!ctx) return;

  /* ============================================
     SETTINGS
     ============================================ */

  const TOTAL = 190;

  const POLL_INTERVAL = 600;

  const COLOR_DURATION = 450;

  const expectedQuestion =
    new URLSearchParams(
      location.search
    ).get("q");

  const reducedMotion =
    matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

  let questionId = null;

  let options = [];

  let hasVotes = false;

  let particles = [];

  let protectedAreas = [];

  let width = 1;

  let height = 1;

  let lastFrame = 0;

  let fetching = false;

  let ready = false;

  let lastSignature = "";

  /* ============================================
     COLOR HELPERS
     ============================================ */

  function random(min, max) {
    return min + Math.random() * (max - min);
  }

  function hexToRgb(hex) {
    const value = String(
      hex || "#FDCB4E"
    ).replace("#", "");

    const full =
      value.length === 3
        ? value.split("")
            .map(c => c + c)
            .join("")
        : value;

    const n = parseInt(full, 16);

    if (!Number.isFinite(n)) {
      return [253, 203, 78];
    }

    return [
      (n >> 16) & 255,
      (n >> 8) & 255,
      n & 255
    ];
  }

  function mixColor(a, b, t) {
    const progress = Math.max(
      0,
      Math.min(1, t)
    );

    return [
      a[0] + (b[0] - a[0]) * progress,
      a[1] + (b[1] - a[1]) * progress,
      a[2] + (b[2] - a[2]) * progress
    ];
  }

  function asRgb(rgb) {
    return (
      "rgb(" +
      Math.round(rgb[0]) + "," +
      Math.round(rgb[1]) + "," +
      Math.round(rgb[2]) + ")"
    );
  }

  /* ============================================
     BUBBLE DISTRIBUTION
     ============================================ */

  function colorShares() {
    if (!options.length) {
      return [];
    }

    if (!hasVotes) {
      return options.map(
        () => 1 / options.length
      );
    }

    const values = options.map(
      o => Math.max(
        0,
        Number(o.percentage) || 0
      )
    );

    const sum = values.reduce(
      (a, b) => a + b,
      0
    );

    return sum
      ? values.map(v => v / sum)
      : options.map(
          () => 1 / options.length
        );
  }

  function targetCounts() {
    const shares = colorShares();

    if (!shares.length) {
      return [];
    }

    const exact = shares.map(
      share => share * TOTAL
    );

    const counts = exact.map(
      Math.floor
    );

    const remaining =
      TOTAL - counts.reduce(
        (a, b) => a + b,
        0
      );

    const order = exact.map(
      (number, index) => ({
        index,
        fraction:
          number - Math.floor(number)
      })
    ).sort(
      (a, b) =>
        b.fraction - a.fraction
    );

    for (
      let i = 0;
      i < remaining;
      i++
    ) {
      counts[order[i].index]++;
    }

    return counts;
  }

  /* ============================================
     PARTICLES
     ============================================ */

  function createParticle(index) {
    const angle =
      random(0, Math.PI * 2);

    const velocity =
      random(30, 62);

    const rgb = hexToRgb(
      options[index]?.color
    );

    return {
      x: random(0, width),
      y: random(0, height),

      vx:
        Math.cos(angle) * velocity,

      vy:
        Math.sin(angle) * velocity,

      radius:
        random(
          width * .006,
          width * .016
        ),

      opacity:
        random(.5, .83),

      index,

      from: rgb.slice(),
      to: rgb.slice(),
      rgb: rgb.slice(),

      changeAt: 0,
      duration: COLOR_DURATION
    };
  }

  function resetParticles() {
    const counts = targetCounts();

    const indexes = [];

    counts.forEach(
      (count, index) => {
        for (
          let i = 0;
          i < count;
          i++
        ) {
          indexes.push(index);
        }
      }
    );

    for (
      let i = indexes.length - 1;
      i > 0;
      i--
    ) {
      const j = Math.floor(
        Math.random() * (i + 1)
      );

      [
        indexes[i],
        indexes[j]
      ] = [
        indexes[j],
        indexes[i]
      ];
    }

    particles = indexes.map(
      createParticle
    );
  }

  /* ============================================
     FAST SMOOTH COLOR TRANSITIONS
     ============================================ */

  function scheduleColors() {
    if (
      !particles.length ||
      !options.length
    ) {
      resetParticles();
      return;
    }

    const desired = targetCounts();

    const groups = options.map(
      () => []
    );

    particles.forEach(
      (particle, index) => {
        groups[particle.index]
          ?.push(index);
      }
    );

    const deficit = desired.map(
      (count, index) =>
        count - groups[index].length
    );

    const now = performance.now();

    const changes = [];

    for (
      let to = 0;
      to < deficit.length;
      to++
    ) {
      while (deficit[to] > 0) {
        const from =
          deficit.findIndex(
            number => number < 0
          );

        if (from < 0) break;

        const particleIndex =
          groups[from].pop();

        if (
          particleIndex === undefined
        ) {
          break;
        }

        deficit[from]++;
        deficit[to]--;

        groups[to].push(
          particleIndex
        );

        changes.push({
          particleIndex,
          targetIndex: to
        });
      }
    }

    changes.forEach(
      ({
        particleIndex,
        targetIndex
      }) => {

        const particle =
          particles[particleIndex];

        const elapsed = Math.max(
          0,
          Math.min(
            1,
            (
              now - particle.changeAt
            ) / particle.duration
          )
        );

        const current = mixColor(
          particle.from,
          particle.to,
          elapsed
        );

        particle.from = current;
        particle.rgb = current;

        particle.to = hexToRgb(
          options[targetIndex].color
        );

        particle.index =
          targetIndex;

        particle.changeAt =
          now + Math.random() * 100;

        particle.duration =
          COLOR_DURATION;
      }
    );
  }

  /* ============================================
     DISPLAY RESULTS
     ============================================ */

  function renderResults() {
    resultBox.replaceChildren();

    resultBox.classList.toggle(
      "many",
      options.length > 3
    );

    resultBox.classList.toggle(
      "dense",
      options.length > 8
    );

    options.forEach(
      option => {

        const item =
          document.createElement("div");

        item.className = "result";

        const percentage =
          document.createElement("div");

        percentage.className =
          "percentage protect";

        percentage.style.color =
          option.color;

        percentage.textContent =
          hasVotes
            ? option.percentage + "%"
            : "—";

        const heart =
          document.createElement("div");

        heart.className =
          "heart protect";

        heart.textContent =
          option.heart;

        const label =
          document.createElement("div");

        label.className =
          "faculty protect";

        label.textContent =
          option.text;

        item.append(
          percentage,
          heart,
          label
        );

        resultBox.appendChild(
          item
        );
      }
    );

    updateAreas();
  }

  /* ============================================
     PROTECT TEXT FROM BUBBLES
     ============================================ */

  function updateAreas() {
    const base =
      screen.getBoundingClientRect();

    protectedAreas = [
      ...screen.querySelectorAll(
        ".protect"
      )
    ].map(
      element => {
        const rect =
          element.getBoundingClientRect();

        return {
          left:
            rect.left - base.left - 6,

          right:
            rect.right - base.left + 6,

          top:
            rect.top - base.top - 6,

          bottom:
            rect.bottom - base.top + 6
        };
      }
    );
  }

  function overlapsText(x, y, radius) {
    return protectedAreas.some(
      area =>
        x + radius > area.left &&
        x - radius < area.right &&
        y + radius > area.top &&
        y - radius < area.bottom
    );
  }

  /* ============================================
     RESIZE
     ============================================ */

  function resize() {
    const rect =
      screen.getBoundingClientRect();

    if (
      !rect.width ||
      !rect.height
    ) {
      return;
    }

    const oldWidth = width;
    const oldHeight = height;

    width = rect.width;
    height = rect.height;

    const ratio = Math.min(
      devicePixelRatio || 1,
      2
    );

    canvas.width =
      Math.round(width * ratio);

    canvas.height =
      Math.round(height * ratio);

    ctx.setTransform(
      ratio,
      0,
      0,
      ratio,
      0,
      0
    );

    if (particles.length) {
      particles.forEach(
        particle => {

          particle.x =
            particle.x / oldWidth * width;

          particle.y =
            particle.y / oldHeight * height;

          particle.radius =
            particle.radius /
            oldWidth * width;
        }
      );
    }

    updateAreas();
  }

  /* ============================================
     BUBBLE ANIMATION
     ============================================ */

  function frame(now) {
    const dt = lastFrame
      ? Math.min(
          (now - lastFrame) / 1000,
          .04
        )
      : 0;

    lastFrame = now;

    ctx.clearRect(
      0,
      0,
      width,
      height
    );

    for (const particle of particles) {

      if (!reducedMotion) {
        const nx =
          particle.x +
          particle.vx * dt;

        const ny =
          particle.y +
          particle.vy * dt;

        if (
          overlapsText(
            nx,
            ny,
            particle.radius
          )
        ) {
          if (
            !overlapsText(
              nx,
              particle.y,
              particle.radius
            )
          ) {
            particle.vy *= -1;
            particle.x = nx;

          } else if (
            !overlapsText(
              particle.x,
              ny,
              particle.radius
            )
          ) {
            particle.vx *= -1;
            particle.y = ny;

          } else {
            particle.vx *= -1;
            particle.vy *= -1;
          }

        } else {
          particle.x = nx;
          particle.y = ny;
        }

        if (
          particle.x >
          width + particle.radius
        ) {
          particle.x =
            -particle.radius;

        } else if (
          particle.x <
          -particle.radius
        ) {
          particle.x =
            width + particle.radius;
        }

        if (
          particle.y >
          height + particle.radius
        ) {
          particle.y =
            -particle.radius;

        } else if (
          particle.y <
          -particle.radius
        ) {
          particle.y =
            height + particle.radius;
        }
      }

      if (
        overlapsText(
          particle.x,
          particle.y,
          particle.radius
        )
      ) {
        continue;
      }

      const t = Math.max(
        0,
        Math.min(
          1,
          (
            now - particle.changeAt
          ) / particle.duration
        )
      );

      const eased =
        t * t * (3 - 2 * t);

      particle.rgb = mixColor(
        particle.from,
        particle.to,
        eased
      );

      ctx.globalAlpha =
        particle.opacity;

      ctx.fillStyle =
        asRgb(particle.rgb);

      ctx.beginPath();

      ctx.arc(
        particle.x,
        particle.y,
        particle.radius,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }

    ctx.globalAlpha = 1;

    requestAnimationFrame(
      frame
    );
  }

  /* ============================================
     PROJECTOR READY SIGNAL
     ============================================ */

  function tellParentReady() {
    if (
      window.parent === window
    ) {
      return;
    }

    window.parent.postMessage(
      {
        type:
          "SPORTUNI_POLL_READY",

        questionId
      },
      location.origin
    );
  }

  /* ============================================
     LOAD REAL POLL RESULTS
     ============================================ */

  async function loadResults() {
    if (fetching) {
      return;
    }

    fetching = true;

    try {
      const response = await fetch(
        "/api/screen/poll",
        {
          cache: "no-store",
          credentials: "same-origin"
        }
      );

      if (!response.ok) {
        throw new Error(
          "Poll API error"
        );
      }

      const data =
        await response.json();

      if (
        !data.active ||
        !data.question
      ) {
        return;
      }

      if (
        expectedQuestion &&
        data.question.id !==
          expectedQuestion
      ) {
        return;
      }

      if (
        !Array.isArray(
          data.options
        ) ||
        data.options.length < 2
      ) {
        return;
      }

      const nextOptions =
        data.options.map(
          option => ({
            id: option.id,

            text: option.text,

            color:
              option.color ||
              "#FDCB4E",

            heart:
              option.heart ||
              "💛",

            percentage:
              Number(
                option.percentage
              ) || 0
          })
        );

      const nextHasVotes =
        Boolean(data.has_votes);

      const changedQuestion =
        questionId !==
        data.question.id;

      const nextSignature =
        JSON.stringify({
          question: data.question,
          options: nextOptions,
          hasVotes: nextHasVotes
        });

      if (
        !changedQuestion &&
        nextSignature ===
          lastSignature
      ) {
        return;
      }

      questionId =
        data.question.id;

      title.textContent =
        data.question.text;

      hasVotes =
        nextHasVotes;

      options =
        nextOptions;

      lastSignature =
        nextSignature;

      renderResults();

      if (
        changedQuestion ||
        !particles.length
      ) {
        resetParticles();

      } else {
        scheduleColors();
      }

      if (!ready) {
        ready = true;

        loadingBox.hidden = true;

        tellParentReady();
      }

    } catch (error) {
      console.warn(
        "Live Poll results:",
        error
      );

    } finally {
      fetching = false;
    }
  }

  /* ============================================
     PROJECTOR ACTIVATION

     Refresh immediately.
     Do not send a repeated READY message:
     prevents a message feedback loop.
     ============================================ */

  window.addEventListener(
    "message",
    event => {

      if (
        event.origin !==
        location.origin
      ) {
        return;
      }

      if (
        event.data?.type ===
        "SPORTUNI_POLL_ACTIVATE"
      ) {
        loadResults();
      }
    }
  );

  /* ============================================
     START
     ============================================ */

  resize();

  if (
    typeof ResizeObserver !==
    "undefined"
  ) {
    new ResizeObserver(
      resize
    ).observe(screen);

  } else {
    addEventListener(
      "resize",
      resize
    );
  }

  requestAnimationFrame(
    frame
  );

  // Fetch actual results before displaying Poll.
  loadResults();

  // Continue updating percentages in real time.
  setInterval(
    loadResults,
    POLL_INTERVAL
  );

  document.addEventListener(
    "visibilitychange",
    () => {
      if (!document.hidden) {
        loadResults();
      }
    }
  );

})();
</script>

</body>
</html>
