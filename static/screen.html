
<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SPORTUNI WELCOME 2026 | Projector</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #093759;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #093759;
    }

    iframe[hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- QR CODE SCREEN -->
  <iframe
    id="qr"
    title="SPORTUNI QR"
    src="/qr-view">
  </iframe>

  <!-- ORIGINAL LIVE WALL -->
  <iframe
    id="wall"
    title="SPORTUNI Live Wall"
    src="/wall-view"
    hidden>
  </iframe>

  <!-- NEW LIVE POLL -->
  <iframe
    id="poll"
    title="SPORTUNI Live Poll"
    src="/poll-view"
    hidden>
  </iframe>

  <script src="/static/screen.js"></script>

</body>
</html>
